<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Produk · Laporan SPG</title>
<link rel="stylesheet" href="../assets/css/style.css?v=202610060311">
</head>
<body data-root="../">
<main>
  <div class="page-head"><div><h1>Produk</h1></div><span class="muted" id="count"></span></div>
  <section><div class="table-wrap"><table id="table"></table></div></section>
  <form id="form" autocomplete="off">
    <h2 id="formTitle">Tambah produk</h2>
    <input type="hidden" name="id">
    <div class="form-grid">
      <div class="field"><label for="p-name">Nama</label><input class="input" id="p-name" name="name" required></div>
      <div class="field"><label for="p-sku">SKU</label><input class="input" id="p-sku" name="sku"></div>
      <div class="field"><label for="p-price">Harga (Rp)</label><input class="input" id="p-price" name="price" type="number" min="0" step="500" required></div>
    </div>
    <p><label class="check"><input type="checkbox" name="active" checked> Aktif</label></p>
    <div class="actions"><button class="btn" type="submit">Simpan</button><button class="btn ghost" type="button" id="cancel" hidden>Batal</button></div>
  </form>
</main>
<script src="../assets/js/data.js?v=202610060311"></script>
<script src="../assets/js/common.js?v=202610060311"></script>
<script src="../assets/js/pages/admin-produk.js?v=202610060311"></script>
</body>
</html>
