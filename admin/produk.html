<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#00136F">
<title>Produk · Laporan SPG</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-root="../">
<main>
  <h1>Produk</h1>
  <p class="lead">Katalog produk dan harga default untuk form laporan SPG.</p>
  <div class="card">
    <div class="row" style="margin-bottom:6px"><h2 style="margin:0">Daftar Produk</h2><span class="pill info" id="count"></span></div>
    <div class="table-wrap"><table id="table"></table></div>
  </div>
  <form class="card" id="form" autocomplete="off">
    <h2 id="formTitle">Tambah Produk</h2>
    <input type="hidden" name="id">
    <div class="form-grid">
      <div class="field"><label for="p-name">Nama produk</label><input class="input" id="p-name" name="name" required></div>
      <div class="field"><label for="p-sku">SKU</label><input class="input" id="p-sku" name="sku"></div>
      <div class="field"><label for="p-price">Harga default (Rp)</label><input class="input" id="p-price" name="price" type="number" min="0" step="500" required></div>
    </div>
    <label class="check" style="margin-bottom:14px"><input type="checkbox" name="active" checked> Aktif (muncul di form laporan)</label>
    <div class="row" style="justify-content:flex-start">
      <button class="btn" type="submit">Simpan Produk</button>
      <button class="btn ghost" type="button" id="cancel" hidden>Batal</button>
    </div>
  </form>
</main>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/pages/admin-produk.js"></script>
</body>
</html>
