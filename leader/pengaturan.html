<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Pengaturan · Laporan SPG</title>
<link rel="icon" type="image/png" href="../assets/brand/favicon.png">
<link rel="stylesheet" href="../assets/css/style.css?v=20261006035505">
<script>/* version check */(function(v,r){try{fetch(r+"assets/version.json?t="+Date.now(),{cache:"no-store"}).then(function(x){return x.json()}).then(function(j){if(j.v&&j.v!==v){var u=new URL(location.href);if(u.searchParams.get("_v")!==j.v){u.searchParams.set("_v",j.v);location.replace(u.href)}}}).catch(function(){})}catch(e){}})("20261006035505","../")</script>
</head>
<body data-root="../">
<main>
  <div class="page-head"><div><h1>Pengaturan</h1><p class="sub" id="sub"></p></div><button type="button" class="btn" id="save">Simpan</button></div>
  <section>
    <h2>Hari kerja</h2>
    <div class="chips" id="days"></div>
    <p class="note" id="dayCount"></p>
  </section>
  <section>
    <h2>Laporan</h2>
    <div class="form-grid">
      <div class="field"><label for="editDays">Batas ubah laporan (hari)</label><input class="input" type="number" id="editDays" min="0" max="14" step="1"></div>
      <div class="field"><label for="reminder">Jam pengingat</label><input class="input" type="time" id="reminder"></div>
    </div>
  </section>
  <section>
    <h2>Hari libur</h2>
    <div class="table-wrap"><table id="holidays"></table></div>
    <div class="form-grid" style="margin-top:16px">
      <div class="field"><label for="hDate">Tanggal</label><input class="input" type="date" id="hDate"></div>
      <div class="field"><label for="hName">Keterangan</label><input class="input" id="hName"></div>
    </div>
    <div class="actions">
      <label class="check"><input type="checkbox" id="hWork"> Tetap hari kerja</label>
      <button type="button" class="icon-btn primary" id="addHoliday" aria-label="Tambah hari libur" data-icon="plus"></button>
    </div>
  </section>
</main>
<script src="../assets/js/data.js?v=20261006035505"></script>
<script src="../assets/js/common.js?v=20261006035505"></script>
<script src="../assets/js/pages/leader-pengaturan.js?v=20261006035505"></script>
</body>
</html>
