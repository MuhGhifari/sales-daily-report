<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Isi Laporan · Laporan SPG</title>
<link rel="stylesheet" href="../assets/css/style.css?v=202610060311">
</head>
<body data-root="../">
<main>
  <div class="page-head"><div><h1 id="title">Isi Laporan</h1><p class="sub" id="sub"></p></div></div>
  <div id="notes-top"></div>
  <form id="form" novalidate>
    <div class="form-grid">
      <div class="field"><label for="date">Tanggal</label><div id="dateField"></div></div>
      <div class="field"><label for="store">Toko</label><input class="input" id="store" readonly></div>
    </div>
    <p><label class="check"><input type="checkbox" id="noSales"> Tidak ada penjualan</label></p>
    <div class="line-nums small muted" style="margin:16px 0 6px"><span>Qty</span><span>Harga satuan</span><span class="line-sub">Subtotal</span></div>
    <div id="lines"></div>
    <p><button type="button" class="link" id="add">+ Tambah produk</button></p>
    <div class="field"><label for="notes">Catatan</label><input class="input" id="notes" maxlength="200"></div>
    <div class="total-bar">
      <div class="top"><span class="muted">Total</span><b id="total">Rp 0</b></div>
      <button class="btn block" type="submit" id="submit">Kirim Laporan</button>
    </div>
  </form>
</main>
<script src="../assets/js/data.js?v=202610060311"></script>
<script src="../assets/js/common.js?v=202610060311"></script>
<script src="../assets/js/pages/spg-laporan.js?v=202610060311"></script>
</body>
</html>
